app = "automyinvoice"
primary_region = "nrt"

[build]

[deploy]
  release_command = "/app/bin/migrate"

[env]
  PHX_SERVER = "true"
  PHX_HOST = "automyinvoice.fly.dev"
  ECTO_IPV6 = "true"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 1000

[[vm]]
  # 1GB: ChromicPDF(Chromium) PDF 생성이 512MB에서 렌더러 OOM(targetCrashed)
  # 으로 실패. BEAM+Phoenix와 Chromium 동시 구동에 1GB 필요.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
