name: iOS CI

on:
  push:
    branches: [main]
    paths: ['apps/ios/**']
  pull_request:
    branches: [main]
    paths: ['apps/ios/**']

jobs:
  build:
    # macos-15 ships Xcode 16+. The project is saved in objectVersion 77
    # (Xcode 16/26 format), which Xcode 15.4 on macos-14 cannot open
    # ("future Xcode project file format (77)").
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build and Test
        working-directory: apps/ios/InVoiceFlow_iOS
        run: |
          xcodebuild test \
            -project InVoiceFlow_iOS.xcodeproj \
            -scheme InVoiceFlow_iOS \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO
